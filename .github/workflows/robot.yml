# Respaldo del robot: cada 5 minutos, de 10:00 a. m. a 11:55 p. m. (hora de Colombia),
# visita /api/hoy, que despierta al robot igual que lo hacen las visitas.
# No necesita secretos. Si cambia el dominio, cambiar SITIO abajo
# (o crear la variable SITE_URL en Settings → Secrets and variables → Actions → Variables).
name: robot

on:
  schedule:
    - cron: "*/5 15-23 * * *"   # 10:00 a. m. – 6:55 p. m. Colombia (UTC-5)
    - cron: "*/5 0-4 * * *"     # 7:00 p. m. – 11:55 p. m. Colombia
  workflow_dispatch:

env:
  SITIO: ${{ vars.SITE_URL || 'https://loteria-gules.vercel.app' }}

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Despertar al robot
        run: curl -fsS --max-time 60 "$SITIO/api/hoy"
