# Respaldo del robot: cada 5 minutos, de 9:55 a. m. a 11:59 p. m. (hora de Colombia),
# llama a /api/robot. Las visitas también lo despiertan; esto cubre las horas sin tráfico.
# Necesita dos secretos en GitHub (Settings → Secrets → Actions): SITE_URL y CRON_SECRET.
name: robot

on:
  schedule:
    - cron: "*/5 15-23 * * *"   # 10:00 a. m. – 6:55 p. m. Colombia (UTC-5)
    - cron: "*/5 0-4 * * *"     # 7:00 p. m. – 11:55 p. m. Colombia
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Despertar al robot
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan los secretos SITE_URL y CRON_SECRET: no se hace nada."
            exit 0
          fi
          curl -fsS --max-time 70 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/robot"
